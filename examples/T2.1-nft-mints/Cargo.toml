[workspace]

[package]
name = "nft_mints"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.8.0-beta"
substreams-ethereum = "0.12.0-beta.1"
buffa = { version = "0.9", default-features = false, features = ["std", "fast-utf8"] }
buffa-types = { version = "0.9", default-features = false }
hex = "0.4"

[build-dependencies]
buffa-build = "0.9"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
