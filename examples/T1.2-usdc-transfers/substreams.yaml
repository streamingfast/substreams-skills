specVersion: v0.1.0

package:
  name: usdc-transfers
  version: v0.1.0
  description: Emits every USDC transfer on Ethereum mainnet

protobuf:
  files:
    - usdc_transfers.proto
  importPaths:
    - ./proto
  excludePaths:
    - sf/substreams
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/usdc_transfers.wasm

modules:
  - name: map_usdc_transfers
    kind: map
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:usdc.transfers.v1.UsdcTransfers

network: mainnet
